name: Packer Create Image for Node.js App

on:
  push:
    branches:
      - main  # Trigger workflow on push to the main branch
  pull_request:
    types:
      - closed  # Trigger workflow only when a pull request is closed

jobs:
  packer-buildimage:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push' 

    steps:
      # Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # Start MySQL Service (for integration tests)
      - name: Configure MySQL Database
        run: |
          sudo systemctl start mysql
          sudo systemctl status mysql

      # Wait for MySQL to be fully up and running
      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to start..."
          sleep 10
          sudo mysql -u${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_NAME }}\`;"

      # Configure environment variables required for the application
      - name: Configure Environment Variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env  
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      # Install application dependencies
      - name: Install Dependencies
        run: npm install

      # Run integration tests (workflow fails if tests fail)
      - name: Run Integration Tests
        run: npm test  

      #  Building the application artifact
      - name: Build Application Artifact
        run: |
          mkdir -p build
          zip -r build/webapp.zip . -x "node_modules/*" ".git/*"

      # Moving the artifact to the Packer directory
      - name: Move Web App to Packer Directory
        run: |
          mv build/webapp.zip packer/

      # Set up AWS CLI for authentication
      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Authenticate with Google Cloud
      - name: Set up Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

       # Install Packer using the official GitHub Action
      - name: Setup Packer
        uses: hashicorp/setup-packer@main

      # Building a custom image for AWS & GCP in parallel using Packer
      - name: Build Custom Image with Packer
        run: |
          cd packer
          packer init .
          packer build image.pkr.hcl

          SOURCE_AMI=$(awk -F, '/artifact,0,id/ {print $6}' packer.log | cut -d: -f2)
          GCP_PROJECT=$(awk -F, '/artifact,1,id/ {print $6}' packer.log | cut -d: -f2)
          
          if [ -n "$AMI_ID" ]; then
            echo "ami_id=$AMI_ID" >> $GITHUB_ENV
            echo "AMI_CREATED=true" >> $GITHUB_ENV
          else
            echo "AMI_CREATED=false" >> $GITHUB_ENV
          fi

          if [ -n "$GCP_PROJECT" ]; then
            echo "gcp_image_id=$GCP_PROJECT" >> $GITHUB_ENV
          fi

      - name: Share AMI with Demo Account
        if: env.AMI_CREATED == 'true'
        run: |
          aws ec2 modify-image-attribute \
            --image-id ${{ env.ami_id }} \
            --launch-permission "{\"Add\":[{\"UserId\":\"${{ secrets.DEMO_ACCOUNT_ID }}\"]}"

      - name: Share GCP Machine Image
        run: |
          gcloud compute images add-iam-policy-binding ${{ env.gcp_image_id }} \
            --member="user:${{ secrets.DEMO_GCP_USER }}" \
            --role="roles/compute.imageUser"

      - name: Update AWS Launch Template
        run: |
          aws ec2 create-launch-template-version \
            --launch-template-name "${{ secrets.LAUNCH_TEMPLATE_NAME }}" \
            --source-version "\$Latest" \
            --version-description "Updated with latest AMI ID" \
            --launch-template-data "{\"ImageId\": \"${{ env.ami_id }}\"}"

          aws ec2 modify-launch-template \
            --launch-template-name "${{ secrets.LAUNCH_TEMPLATE_NAME }}" \
            --default-version "\$Latest"
            
      - name: Update GCP Instance Template
        run: |
          gcloud compute instance-templates create "my-template-${{ github.run_id }}" \
            --machine-type=n1-standard-1 \
            --image=${{ env.gcp_image_id }} \
            --tags=http-server,https-server \
            --boot-disk-size=20GB \
            --metadata=startup-script='#! /bin/bash
            sudo systemctl daemon-reload
            sudo systemctl enable myapp
            sudo systemctl start myapp'