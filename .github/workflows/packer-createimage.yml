name: Packer Create Image for Node.js App

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - closed

jobs:
  packer-buildimage:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          
      - name: Configure MySQL Database
        run: |
          sudo systemctl start mysql
          sudo systemctl status mysql

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL to start..."
          sleep 10
          sudo mysql -u${{ secrets.DB_USER }} -p${{ secrets.DB_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_NAME }}\`;"
          
      - name: Configure Environment Variables
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" >> .env  
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      - name: Install Dependencies
        run: npm install

      - name: Run Integration Tests
        run: npm test  

      - name: Build Application Artifact
        run: |
          mkdir -p build
          zip -r build/webapp.zip . -x "node_modules/*" ".git/*"

      - name: Move Web App to Packer Directory
        run: |
          mv build/webapp.zip packer/

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Google Cloud SDK
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Install AWS & GCP CLI
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unzip curl
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o "AWSCLIV2.pkg"
          sudo installer -pkg AWSCLIV2.pkg -target /
          curl -sSL https://sdk.cloud.google.com | bash

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Initialize Packer
        run: |
          cd packer
          packer init .

      - name: Build Custom Image in AWS & GCP
        run: |
          cd packer
          packer build -var "aws_access_key=${{ secrets.AWS_ACCESS_KEY_ID }}" \
                       -var "aws_secret_key=${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
                       -var "gcp_project_id=${{ secrets.GCP_PROJECT_ID }}" \
                       image.pkr.hcl
