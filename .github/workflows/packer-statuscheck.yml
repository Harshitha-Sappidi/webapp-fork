name: Packer Status Check

on:
  pull_request:
    branches:
      - main

jobs:
  packer-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Zip Web App
        run: zip -r webapp.zip ./

      - name: Install Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Run Packer Fmt
        id: fmt
        run: |
          packer fmt -check .
        continue-on-error: true

      - name: Fail if Packer Fmt Modified Files
        run: |
          if [[ $(git status --porcelain) ]]; then
            echo "Packer fmt modified files. Please run 'packer fmt' locally."
            exit 1
          fi

      - name: Run Packer Validate
        run: |
          packer validate .


