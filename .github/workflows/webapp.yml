name: Node.js CI with MySQL

on:
  pull_request:
    branches: ["main"]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install MySQL
        run: |
          echo "Installing MySQL..."
          sudo apt-get update
          sudo apt-get install -y mysql-server
          sudo systemctl start mysql
          sudo systemctl enable mysql
          echo "MySQL installation complete."

      - name: Verify MySQL Service Status
        run: |
          echo "Checking MySQL status..."
          sudo systemctl status mysql || true

      - name: Wait for MySQL to Start
        run: |
          for i in {1..30}; do
            if sudo mysqladmin ping -h 127.0.0.1 --silent; then
              echo "MySQL is up!"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Setup MySQL Database and User
        run: |
          echo "Configuring MySQL..."
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY '${{ secrets.DB_PASSWORD }}'; FLUSH PRIVILEGES;"
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS \`${{ secrets.DB_NAME }}\`;"
          echo "MySQL configuration complete."

      - name: Verify MySQL Connection
        run: |
          echo "Testing MySQL connection..."
          mysql -uroot -p"${{ secrets.DB_PASSWORD }}" -e "SHOW DATABASES;"

      - name: Configure Environment Variables
        run: |
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_USER=root" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_PORT=3306" >> .env
          echo "PORT=${{ secrets.PORT }}" >> .env

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
