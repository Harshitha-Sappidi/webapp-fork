name: Web App CI

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Application Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 23.7.0 

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test
